<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumi · Google Agenda</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e1016; color: #eef2f8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
    img { width: 96px; height: 96px; border-radius: 24px; }
    h1 { font-size: 22px; margin: 16px 0 6px; }
    p { color: #98a2b3; margin: 0; }
  </style>
</head>
<body>
  <div>
    <img src="icons/icon-192.png" alt="Lumi" />
    <h1 id="t">Google Agenda conectado! ✨</h1>
    <p id="m">Pode fechar esta aba e voltar para a Lumi.</p>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get('erro')) {
      document.getElementById('t').textContent = 'Não deu certo 😕';
      document.getElementById('m').textContent = 'Motivo: ' + q.get('erro') + '. Volte para a Lumi e tente de novo.';
    }
  </script>
</body>
</html>
